name: Build Half-Life PHP Windows

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"


env:
  PHP_VERSION: "8.1"
  PHP_RUNTIME_URL: "https://windows.php.net/downloads/releases/php-8.1.29-Win32-vs16-x64.zip"

  PHP_GLFW_URL: "https://github.com/mario-deluna/php-glfw/releases/download/v0.5.0/win_glfw_php8.1_ts_x64.zip"

  PHP_GLFW_SHA256: "a9c464210a0c8fec9424aafc6f3e8f7b16c023f059c0ae242865725495cf8d7d"


jobs:

  build:

    name: Build Windows x64
    runs-on: windows-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      #
      # Build PHP environment
      #
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer


      #
      # Composer dependencies
      #
      - name: Install dependencies
        shell: pwsh
        run: |
          composer install `
            --no-dev `
            --prefer-dist `
            --optimize-autoloader


      #
      # Install Box
      #
      - name: Install Box
        shell: pwsh
        run: |
          composer require --dev humbug/box:dev-main


      #
      # Build PHAR
      #
      - name: Build PHAR
        shell: pwsh
        run: |
          vendor/bin/box compile


      #
      # Install PHPacker
      #
      - name: Install PHPacker
        shell: pwsh
        run: |
          composer global require phpacker/phpacker


      - name: Add Composer global bin
        shell: pwsh
        run: |
          echo "$env:APPDATA\Composer\vendor\bin" >> $env:GITHUB_PATH


      #
      # Build EXE
      #
      - name: Build executable
        shell: pwsh
        run: |
          phpacker `
            build/half-life-php.phar `
            --php-version=8.1 `
            --arch=x64 `
            --output=half-life-php.exe



      #
      # Prepare release folders
      #
      - name: Create release folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/runtime/ext



      #
      # Download PHP runtime
      #
      - name: Download PHP runtime
        shell: pwsh
        run: |

          Invoke-WebRequest `
            $env:PHP_RUNTIME_URL `
            -OutFile php.zip


          Expand-Archive `
            php.zip `
            release/runtime



      #
      # Download PHP GLFW
      #
      - name: Download PHP GLFW
        shell: pwsh
        run: |

          Invoke-WebRequest `
            $env:PHP_GLFW_URL `
            -OutFile php-glfw.zip



      #
      # Verify PHP GLFW checksum
      #
      - name: Verify PHP GLFW
        shell: pwsh
        run: |

          $hash = (
            Get-FileHash `
              php-glfw.zip `
              -Algorithm SHA256
          ).Hash.ToLower()


          if ($hash -ne "${{ env.PHP_GLFW_SHA256 }}") {

            Write-Host "Expected:"
            Write-Host "${{ env.PHP_GLFW_SHA256 }}"

            Write-Host "Received:"
            Write-Host $hash

            exit 1
          }



      #
      # Install PHP GLFW
      #
      - name: Install PHP GLFW
        shell: pwsh
        run: |

          Expand-Archive `
            php-glfw.zip `
            php-glfw


          Copy-Item `
            php-glfw/*.dll `
            release/runtime/ext/



      #
      # Create php.ini
      #
      - name: Create php.ini
        shell: pwsh
        run: |

          $ini = @(
            'extension_dir="ext"',
            'extension=php_glfw.dll',
            'memory_limit=512M'
          )


          Set-Content `
            release/runtime/php.ini `
            $ini `
            -Encoding ASCII



      #
      # Test PHP GLFW
      #
      - name: Test GLFW extension
        shell: pwsh
        run: |

          release/runtime/php.exe `
            -c release/runtime/php.ini `
            -m |
            Select-String glfw



      #
      # Copy build output
      #
      - name: Assemble release
        shell: pwsh
        run: |

          Copy-Item `
            half-life-php.exe `
            release/


          Copy-Item `
            build/half-life-php.phar `
            release/



      #
      # Package
      #
      - name: Create ZIP
        shell: pwsh
        run: |

          Compress-Archive `
            -Path release/* `
            -DestinationPath half-life-php-windows-x64.zip



      #
      # Upload artifact
      #
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:

          name: half-life-php-windows-x64

          path:
            half-life-php-windows-x64.zip