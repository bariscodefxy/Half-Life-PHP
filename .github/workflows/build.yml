name: Build Half-Life PHP

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"


env:
  PHP_VERSION: "8.2"

  PHP_RUNTIME_URL: "https://windows.php.net/downloads/releases/php-8.2.29-Win32-vs16-x64.zip"

  PHP_GLFW_URL: "https://github.com/mario-deluna/php-glfw/releases/download/v2.4.0/win_glfw_php8.2_ts_x64.zip"

  PHP_GLFW_SHA256: "3aba7d08cb3b7722a1a5950043e6c5214163ceaaf7b87ad99aa17d8c0dcee2ae"



jobs:


  build-phar:

    name: Build PHAR
    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer


      - name: Install dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader


      - name: Install Box
        run: |
          composer require --dev humbug/box:dev-main -W


      - name: Build PHAR
        run: |
          vendor/bin/box compile


      - name: Check PHAR
        run: |
          ls -la build/


      - name: Upload PHAR
        uses: actions/upload-artifact@v4
        with:
          name: half-life-phar
          path: build/half-life-php.phar





  build-windows:


    name: Build Windows x64
    needs: build-phar
    runs-on: windows-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Download PHAR
        uses: actions/download-artifact@v4
        with:
          name: half-life-phar
          path: .



      - name: Check downloaded files
        shell: pwsh
        run: |

          Get-ChildItem -Recurse



      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer



      - name: Install PHPacker
        shell: pwsh
        run: |

          composer global require phpacker/phpacker



      - name: Add Composer global bin
        shell: pwsh
        run: |

          echo "$env:APPDATA\Composer\vendor\bin" >> $env:GITHUB_PATH



      - name: PHPacker help
        shell: pwsh
        run: |

          phpacker --help



      - name: Build executable
        shell: pwsh
        run: |

          phpacker build windows x64 `
            --src=build/half-life-php.phar `
            --dest=release `
            --php=8.2



      - name: Create runtime folders
        shell: pwsh
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            release/runtime/ext



      - name: Download PHP runtime
        shell: pwsh
        run: |

          Invoke-WebRequest `
            $env:PHP_RUNTIME_URL `
            -OutFile php.zip


          Expand-Archive `
            php.zip `
            release/runtime



      - name: Download PHP GLFW
        shell: pwsh
        run: |

          Invoke-WebRequest `
            $env:PHP_GLFW_URL `
            -OutFile php-glfw.zip



      - name: Verify PHP GLFW checksum
        shell: pwsh
        run: |

          $hash = (
            Get-FileHash `
              php-glfw.zip `
              -Algorithm SHA256
          ).Hash.ToLower()


          if ($hash -ne "${{ env.PHP_GLFW_SHA256 }}") {

            Write-Host "Expected:"
            Write-Host "${{ env.PHP_GLFW_SHA256 }}"

            Write-Host "Received:"
            Write-Host $hash

            exit 1
          }



      - name: Install PHP GLFW
        shell: pwsh
        run: |

          Expand-Archive `
            php-glfw.zip `
            php-glfw


          Copy-Item `
            php-glfw/*.dll `
            release/runtime/ext/



      - name: Create php.ini
        shell: pwsh
        run: |

          @(
            'extension_dir="ext"',
            'extension=php_glfw.dll',
            'memory_limit=512M'
          ) |
          Out-File `
            release/runtime/php.ini `
            -Encoding ASCII



      - name: Test PHP GLFW
        shell: pwsh
        run: |

          release/runtime/php.exe `
            -c release/runtime/php.ini `
            -m |
            Select-String glfw



      - name: Assemble release
        shell: pwsh
        run: |

          Copy-Item `
            half-life-php.exe `
            release/


          Copy-Item `
            build/half-life-php.phar `
            release/



      - name: Create ZIP
        shell: pwsh
        run: |

          Compress-Archive `
            -Path release/* `
            -DestinationPath half-life-php-windows-x64.zip



      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:

          name: half-life-php-windows-x64

          path: half-life-php-windows-x64.zip